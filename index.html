<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6efe4">
<title>FEB — Экономика</title>
<style>
/* Palette from ravnovesie.site, 2026-11-25. */
:root{color-scheme:light;--bg:#f6efe4;--surface:#fcf7ed;--text:#30261d;--muted:#665646;--accent:#5b1e2d;--border:#d5c6b2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
main{min-height:100svh;padding:clamp(24px,5vw,72px);border-top:6px solid var(--accent)}
header{display:flex;align-items:baseline;gap:20px;padding-bottom:24px;border-bottom:1px solid var(--border)}
h1{margin:0;color:var(--accent);font-family:Georgia,serif;font-size:36px;font-weight:500;letter-spacing:-.04em}
p{margin:0;font-size:14px;color:var(--muted)}
</style>
</head>
<body><main><header><h1>FEB</h1><p>Экономика</p></header></main></body>
</html>
